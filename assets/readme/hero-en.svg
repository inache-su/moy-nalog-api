<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">moy-nalog-api</title>
  <desc id="desc">An unofficial typed Python client for authentication, sessions, and receipt operations in the Russian self-employed tax service.</desc>

  <rect width="1200" height="420" rx="28" fill="#0D1117"/>

  <g id="title-block" transform="translate(60 48)">
    <text x="0" y="18"
          fill="#EF5A5A"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" font-weight="700" letter-spacing="2.2">
      UNOFFICIAL PYTHON CLIENT · LKNPD.NALOG.RU
    </text>

    <text x="0" y="96"
          fill="#F7F2E8"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="64" font-weight="750" letter-spacing="-2">
      moy-nalog-api
    </text>

    <text x="2" y="141"
          fill="#D7DEE7"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="25" font-weight="500">
      Typed async + sync access to authentication, sessions,
    </text>
    <text x="2" y="177"
          fill="#D7DEE7"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="25" font-weight="500">
      receipts, income history, downloads, and cancellation.
    </text>

    <g id="capabilities" transform="translate(0 210)"
       font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
       font-size="18" font-weight="650">
      <rect x="0" y="0" width="160" height="42" rx="21" fill="#1B232D" stroke="#394453"/>
      <text x="80" y="27" text-anchor="middle" fill="#F7F2E8">async-first</text>

      <rect x="174" y="0" width="150" height="42" rx="21" fill="#1B232D" stroke="#394453"/>
      <text x="249" y="27" text-anchor="middle" fill="#F7F2E8">sync parity</text>

      <rect x="338" y="0" width="176" height="42" rx="21" fill="#1B232D" stroke="#394453"/>
      <text x="426" y="27" text-anchor="middle" fill="#F7F2E8">Pydantic v2</text>
    </g>
  </g>

  <g id="receipt-proof" transform="translate(766 34)">
    <rect x="9" y="10" width="374" height="354" rx="18" fill="#000000" opacity="0.24"/>
    <rect width="374" height="354" rx="18" fill="#F7F2E8"/>
    <line x1="20" y1="2" x2="354" y2="2"
          stroke="#0D1117" stroke-width="10" stroke-linecap="round"
          stroke-dasharray="1 18"/>
    <line x1="20" y1="352" x2="354" y2="352"
          stroke="#0D1117" stroke-width="10" stroke-linecap="round"
          stroke-dasharray="1 18"/>

    <g transform="translate(28 30)"
       font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="0" y="20" fill="#5D6672" font-size="18" font-weight="700" letter-spacing="1.8">
        TYPED RECEIPT
      </text>
      <rect x="222" y="0" width="96" height="30" rx="15" fill="#D9F3E5"/>
      <circle cx="240" cy="15" r="5" fill="#2E8B57"/>
      <text x="252" y="21" fill="#1B6B43" font-size="16" font-weight="750">APPROVED</text>

      <line x1="0" y1="46" x2="318" y2="46" stroke="#D4CCBE"/>

      <text x="0" y="78" fill="#7B746A" font-size="18">AUTH</text>
      <text x="98" y="78" fill="#151A21" font-size="20" font-weight="650">INN + password / SMS</text>

      <text x="0" y="115" fill="#7B746A" font-size="18">REQUEST</text>
      <text x="98" y="115" fill="#151A21" font-size="20" font-weight="650">POST /api/v1/income</text>

      <text x="0" y="152" fill="#7B746A" font-size="18">MODEL</text>
      <text x="98" y="152" fill="#151A21" font-size="20" font-weight="650">ServiceItem[]</text>

      <line x1="0" y1="174" x2="318" y2="174" stroke="#D4CCBE" stroke-dasharray="5 7"/>

      <text x="0" y="215" fill="#7B746A" font-size="18">TOTAL</text>
      <text x="318" y="215" text-anchor="end" fill="#151A21" font-size="30" font-weight="780">18 000.00 RUB</text>

      <text x="0" y="253" fill="#7B746A" font-size="18">OUTPUT</text>
      <text x="98" y="253" fill="#151A21" font-size="20" font-weight="650">Receipt.print_url</text>

      <rect x="0" y="278" width="318" height="36" rx="8" fill="#151A21"/>
      <text x="159" y="302" text-anchor="middle" fill="#F7F2E8" font-size="16" font-weight="650" letter-spacing="0.5">
        REFRESH · RETRIES · 401 × 1
      </text>
    </g>
  </g>

  <g id="receipt-lifecycle" transform="translate(62 344)"
     font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
     font-size="18" font-weight="650">
    <line x1="10" y1="9" x2="676" y2="9" stroke="#394453" stroke-width="2"/>
    <path d="M 664 1 L 678 9 L 664 17" fill="none" stroke="#EF5A5A" stroke-width="2"/>

    <circle cx="10" cy="9" r="9" fill="#EF5A5A"/>
    <text x="0" y="40" fill="#B7C0CC">auth_by_*</text>

    <circle cx="184" cy="9" r="9" fill="#0D1117" stroke="#EF5A5A" stroke-width="3"/>
    <text x="144" y="40" fill="#B7C0CC">create_receipt</text>

    <circle cx="402" cy="9" r="9" fill="#0D1117" stroke="#EF5A5A" stroke-width="3"/>
    <text x="355" y="40" fill="#B7C0CC">get_incomes</text>

    <circle cx="570" cy="9" r="9" fill="#0D1117" stroke="#EF5A5A" stroke-width="3"/>
    <text x="520" y="40" fill="#B7C0CC">cancel_receipt</text>
  </g>
</svg>
